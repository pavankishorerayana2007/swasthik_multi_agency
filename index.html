<style>
/* CSS SECTION: all rules below control appearance, spacing, layout, colors, responsiveness, and animations. */
/* DESIGN TOKENS: reusable colors and animation durations. Change these variables to update the theme consistently. */
:root {
    --gold: #f2c14e;
    --gold2: #ffdf8a;
    --deep: #b8862b;
    --rot: 1.1s;
    --split: 1.25s;
    color-scheme: dark;
}

/* RESET: makes element sizing predictable and removes default margins. */
* {
    box-sizing: border-box;
    margin: 0;
}

html,
body {
    height: 100%;
    background: #000;
    color: #fff;
    overflow: hidden;
    font-family: Georgia,serif;
}

body.done {
    overflow: auto;
}

/* MAIN WEBSITE LAYOUT: styles for the actual site shown after the intro animation. */
/* next page */
#site {
    position: relative;
    min-height: 100%;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 32px;
    overflow: hidden;
}

/* PARTICLE LAYER: positions the decorative floating gold dots behind the content. */
#particles {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
}

.p {
    position: absolute;
    left: 0;
    top: 0;
    border-radius: 50%;
    will-change: transform,opacity;
}

.content {
    position: relative;
    z-index: 1;
    max-width: 560px;
}

.content img {
    width: min(70vw,300px);
    mix-blend-mode: screen;
    margin-bottom: 18px;
}

.content p {
    color: #d9b866;
    font-size: clamp(15px,2.2vw,18px);
    line-height: 1.7;
}

/* INTRO ANIMATION: the split-screen opening overlay shown before the website. */
/* intro */
#intro {
    position: fixed;
    inset: 0;
    z-index: 10;
    overflow: hidden;
    background: transparent;
}

/* SCREEN HALVES: each half covers 50% of the screen and slides away when the intro finishes. */
.half {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 50%;
    overflow: hidden;
    background: #000;
    will-change: transform;
    transition: transform var(--split) cubic-bezier(.76,0,.24,1);
}

.half.l {
    left: 0;
}

.half.r {
    right: 0;
}

#intro.split .l {
    transform: translate3d(-101%,0,0);
}

#intro.split .r {
    transform: translate3d(101%,0,0);
}

/* INTRO STAGE: centers the logo, emblem, and click control inside each half. */
.stage {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 100vw;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(4px,1.2vh,12px);
    padding: 2vh 4vw;
    isolation: isolate;
    background: radial-gradient(ellipse 60% 55% at 50% 45%,#0b0702 0%,#000 70%);
}

.l .stage {
    left: 0;
}

.r .stage {
    left: -100%;
}

.stage>.in {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(4px,1.2vh,12px);
    opacity: 0;
    transition: opacity 1s ease;
}

#intro.ready .in {
    opacity: 1;
}

.arc {
    position: absolute;
    inset: -14% -10%;
    border-radius: 50%;
    border: 2px solid rgba(255,196,70,.55);
    box-shadow: 0 0 28px 4px rgba(255,170,30,.35),inset 0 0 70px 6px rgba(255,160,20,.28);
    pointer-events: none;
    z-index: -1;
}

.arc.b {
    inset: -8% -5%;
    border-width: 1px;
    opacity: .55;
}

/* INTRO LOGO: controls the logo image size and blending with the black background. */
.logo {
    width: min(64vw,60vh,600px);
    height: auto;
    mix-blend-mode: screen;
    display: block;
}

.emblem {
    width: clamp(30px,5.2vmin,58px);
    height: auto;
    mix-blend-mode: screen;
    transform: rotate(45deg);
    transition: transform var(--rot) cubic-bezier(.65,0,.25,1);
    filter: drop-shadow(0 0 6px rgba(255,190,60,.7));
    margin-top: clamp(2px,1vh,10px);
}

#intro.upright .emblem {
    transform: rotate(0deg);
}

/* CLICK CONTROL: styles the clickable 'CLICK' area that starts the intro exit animation. */
.click-area {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    padding: 6px clamp(24px,6vw,56px);
    background: none;
    border: 0;
    cursor: pointer;
    color: var(--gold);
    -webkit-tap-highlight-color: transparent;
    outline: none;
}

.click-area svg {
    width: clamp(150px,24vw,230px);
    height: auto;
    display: block;
    opacity: .9;
    transition: filter .4s;
}

.click-area .fl.b {
    transform: scaleY(-1);
}

.word {
    font-family: "Cormorant Garamond",Georgia,serif;
    font-style: italic;
    font-weight: 600;
    font-size: clamp(24px,4.2vmin,40px);
    letter-spacing: .06em;
    line-height: 1;
    background: linear-gradient(180deg,#fff0b0,#f2c14e 55%,#b8862b);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 3px rgba(255,190,60,.35));
    transition: filter .4s;
}

#intro.hover:not(.upright) .word {
    filter: drop-shadow(0 0 10px rgba(255,200,80,.95)) drop-shadow(0 0 22px rgba(255,170,30,.6));
}

#intro.hover:not(.upright) .click-area svg {
    filter: drop-shadow(0 0 6px rgba(255,190,60,.8));
}

#intro.upright .click-area {
    cursor: default;
}

.l .click-area:focus-visible .word {
    outline: 1px dashed var(--gold);
    outline-offset: 6px;
}

.spin {
    width: clamp(20px,3.6vmin,28px);
    height: auto;
    margin-top: clamp(2px,1vh,10px);
    opacity: 0;
    transition: opacity .5s;
}

#intro.loading .spin {
    opacity: .85;
}

.spin circle {
    fill: none;
    stroke: var(--gold);
    stroke-width: 2;
    stroke-linecap: round;
    stroke-dasharray: .01 7.33;
}

.spin g {
    transform-origin: 20px 20px;
    animation: turn 1.4s linear infinite;
}

@keyframes turn {
    to {
        transform: rotate(360deg);
    }
}

@media (prefers-reduced-motion:reduce) {
    :root {
        --rot: .01s;
        --split: .4s;
    }
    .spin g {
        animation-duration: 6s;
    }
}

html:has(body.done),
body.done {
    overflow: auto;
    height: auto;
}

html {
    scroll-behavior: smooth;
}

#site.site {
    display: block;
    font-family: Inter,system-ui,sans-serif;
    text-align: left;
    padding: 0;
    overflow: visible;
}

.site a {
    color: inherit;
}

.wrap,
.site footer>div {
    position: relative;
    z-index: 1;
    max-width: 1200px;
    margin: auto;
    padding: clamp(48px,8vw,96px) clamp(20px,6vw,80px);
}

.site h1,
.site h2,
.site h3,
.brand,
.big {
    font-family: "Cormorant Garamond",Georgia,serif;
    font-weight: 500;
}

nav.top {
    position: sticky;
    top: 0;
    z-index: 6;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    padding: 10px clamp(16px,4vw,48px);
    background: rgba(0,0,0,.85);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid rgba(242,193,78,.2);
}

.brand {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--gold2);
    text-decoration: none;
    font-size: 24px;
    letter-spacing: .06em;
}

.brand img {
    width: 32px;
    mix-blend-mode: screen;
    filter: drop-shadow(0 0 6px rgba(255,190,60,.6));
}

nav.top ul {
    display: flex;
    gap: 26px;
    list-style: none;
    padding: 0;
}

nav.top ul a {
    color: #cdb98a;
    text-decoration: none;
    font-size: 14px;
    padding: 6px 0;
    border-bottom: 1px solid transparent;
    transition: .3s;
}

nav.top ul a:hover,
nav.top ul a[aria-current] {
    color: var(--gold2);
    border-color: var(--gold);
}

.btn {
    display: inline-block;
    background: var(--gold);
    color: #1a1200;
    padding: 12px 24px;
    border-radius: 3px;
    font: 500 14px Inter,sans-serif;
    text-decoration: none;
    border: 1px solid var(--gold);
    cursor: pointer;
    transition: .3s;
}

.btn:hover {
    box-shadow: 0 0 22px rgba(242,193,78,.5);
    background: var(--gold2);
    transform: translateY(-2px);
}

.site .btn {
    color: #000;
}

.site .btn.g {
    background: none;
    color: var(--gold2);
}

.btn.g:hover {
    background: rgba(242,193,78,.1);
}

.view {
    animation: vin .6s cubic-bezier(.2,.7,.2,1);
}

@keyframes vin {
    from {
        opacity: 0;
        transform: translateY(18px);
    }
}

.hero {
    display: grid;
    grid-template-columns: 1.2fr .8fr;
    gap: 32px;
    align-items: center;
    min-height: 80vh;
}

.hero .wm {
    width: 100%;
    max-width: 640px;
    mix-blend-mode: screen;
}

.hero p {
    color: #b9a77c;
    max-width: 32em;
    line-height: 1.7;
    margin: 20px 0 30px;
    font-size: clamp(16px,2vw,19px);
}

.row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
}

.emb {
    position: relative;
    justify-self: center;
    width: min(70vw,360px);
    aspect-ratio: 1;
    display: grid;
    place-items: center;
}

.emb img {
    width: 78%;
    mix-blend-mode: screen;
    animation: fl 6s ease-in-out infinite;
    filter: drop-shadow(0 0 24px rgba(255,180,40,.55));
}

.emb::before,
.emb::after {
    content: "";
    position: absolute;
    inset: 4%;
    border-radius: 50%;
    border: 1px dashed rgba(242,193,78,.4);
    animation: spin 40s linear infinite;
}

.emb::after {
    inset: 14%;
    border-style: solid;
    border-color: rgba(242,193,78,.15);
    animation-direction: reverse;
    animation-duration: 60s;
}

@keyframes fl {
    50% {
        transform: translateY(-10px);
    }
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

.h2 {
    font-size: clamp(34px,5vw,60px);
    line-height: 1.08;
    color: #fbefc9;
    max-width: 14em;
}

.sub {
    color: #a8976f;
    max-width: 36em;
    line-height: 1.7;
    margin-top: 14px;
}

.grid {
    display: grid;
    gap: 20px;
    margin-top: 40px;
    grid-template-columns: repeat(3,1fr);
}

.grid.two-up {
    grid-template-columns: repeat(2,1fr);
}

.card {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 26px;
    border: 1px solid rgba(242,193,78,.25);
    border-radius: 4px;
    background: linear-gradient(150deg,rgba(24,17,6,.85),rgba(5,5,5,.85));
    text-decoration: none;
    transition: border-color .3s,box-shadow .3s,transform .15s;
    transform-style: preserve-3d;
}

.card:hover {
    border-color: var(--gold);
    box-shadow: 0 0 28px rgba(242,193,78,.15);
}

.card h3 {
    font-size: 30px;
    color: var(--gold2);
    line-height: 1.1;
}

.card p {
    color: #b9a77c;
    line-height: 1.6;
    font-size: 15px;
}

.go {
    margin-top: auto;
    color: var(--gold);
    font-size: 14px;
}

.st {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    color: #b9d9a0;
    width: max-content;
}

.st::before {
    content: "";
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #58d26b;
    box-shadow: 0 0 0 0 rgba(88,210,107,.6);
    animation: pl 2s infinite;
}

.st.l {
    color: #f0c66b;
}

.st.l::before {
    background: #f2c14e;
    animation-name: pl2;
}

@keyframes pl {
    70% {
        box-shadow: 0 0 0 8px transparent;
    }
}

@keyframes pl2 {
    70% {
        box-shadow: 0 0 0 8px transparent;
    }
}

.chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

.chips span,
.chips a {
    font-size: 13px;
    color: #e8cf8a;
    border: 1px solid rgba(242,193,78,.3);
    padding: 5px 12px;
    border-radius: 99px;
    text-decoration: none;
}

.chips a:hover {
    background: rgba(242,193,78,.12);
    border-color: var(--gold);
}

.th {
    aspect-ratio: 16/10;
    border-radius: 3px;
    display: grid;
    place-items: center;
    font: 500 34px "Cormorant Garamond",serif;
    color: rgba(255,235,170,.9);
    border: 1px solid rgba(242,193,78,.2);
    background: radial-gradient(circle at 30% 20%,hsl(var(--h) 60% 22%),#060606 75%);
}

.steps {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 24px;
    margin-top: 40px;
}

.steps div {
    border-left: 1px solid rgba(242,193,78,.4);
    padding-left: 22px;
}

.steps h3 {
    font-size: 36px;
    color: var(--gold2);
    font-style: italic;
}

.steps p {
    color: #a8976f;
    line-height: 1.65;
    margin-top: 8px;
    font-size: 15px;
}

.num {
    font: 500 clamp(44px,6vw,72px) "Cormorant Garamond",serif;
    color: var(--gold2);
    line-height: 1;
}

.lab {
    color: #a8976f;
    font-size: 14px;
    margin-top: 6px;
}

.av {
    width: 84px;
    height: 84px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    font: 500 36px "Cormorant Garamond",serif;
    color: #1a1200;
    background: linear-gradient(145deg,var(--gold2),var(--deep));
    box-shadow: 0 0 18px rgba(242,193,78,.35);
}

.demo {
    display: inline-block;
    font-size: 12px;
    color: #f0c66b;
    border: 1px dashed rgba(242,193,78,.5);
    padding: 3px 10px;
    border-radius: 3px;
    margin-bottom: 14px;
}

.crumb {
    color: #a8976f;
    font-size: 14px;
    margin-bottom: 18px;
}

.crumb a {
    color: var(--gold);
    text-decoration: none;
}

details {
    border-bottom: 1px solid rgba(242,193,78,.2);
    padding: 18px 0;
    max-width: 760px;
}

summary {
    cursor: pointer;
    font: 500 24px "Cormorant Garamond",serif;
    color: #fbefc9;
    list-style: none;
}

summary::after {
    content: "+";
    float: right;
    color: var(--gold);
}

details[open] summary::after {
    content: "–";
}

details p {
    color: #a8976f;
    line-height: 1.7;
    margin-top: 10px;
}

form {
    display: grid;
    gap: 14px;
    max-width: 640px;
    margin-top: 32px;
}

.two {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
}

label {
    display: grid;
    gap: 6px;
    font-size: 13px;
    color: #cdb98a;
}

input,
textarea,
select {
    width: 100%;
    background: #0a0804;
    border: 1px solid rgba(242,193,78,.3);
    color: #fbefc9;
    padding: 13px 14px;
    border-radius: 3px;
    font: inherit;
    font-size: 15px;
}

input:focus,
textarea:focus,
select:focus {
    outline: none;
    border-color: var(--gold);
    box-shadow: 0 0 12px rgba(242,193,78,.25);
}

.ok {
    border: 1px solid var(--gold);
    border-radius: 4px;
    padding: 28px;
    max-width: 640px;
    background: rgba(24,17,6,.8);
    margin-top: 32px;
    line-height: 1.7;
    color: #d9c48a;
}

.site footer {
    position: relative;
    z-index: 1;
    border-top: 1px solid rgba(242,193,78,.2);
    margin-top: 40px;
    background: rgba(0,0,0,.6);
}

.fg {
    display: grid;
    grid-template-columns: 1.3fr 1fr 1.2fr;
    gap: 36px;
}

.fg img {
    width: min(100%,320px);
    mix-blend-mode: screen;
}

.fg h4 {
    font: 500 22px "Cormorant Garamond",serif;
    color: var(--gold2);
    margin-bottom: 12px;
}

.fg a,
.fg span {
    display: block;
    color: #b9a77c;
    text-decoration: none;
    margin: 8px 0;
    font-size: 14px;
}

.fg a:hover {
    color: var(--gold2);
}

.big {
    text-align: center;
    letter-spacing: .35em;
    font-size: clamp(28px,7vw,88px);
    background: linear-gradient(180deg,#fff0b0,#d9a43a 60%,#7a5410);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    padding: 10px 0 26px;
    white-space: nowrap;
    overflow: hidden;
}

.cp {
    text-align: center;
    color: #7d6e48;
    font-size: 13px;
    padding-bottom: 28px;
}

.wa {
    position: fixed;
    right: 18px;
    bottom: 18px;
    z-index: 7;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: #111;
    border: 1px solid var(--gold);
    color: var(--gold2);
    text-decoration: none;
    font-size: 11px;
    font-weight: 500;
    box-shadow: 0 0 18px rgba(242,193,78,.35);
    transition: .3s;
}

.wa:hover {
    transform: scale(1.08);
}

#glow {
    position: fixed;
    width: 420px;
    height: 420px;
    margin: -210px 0 0 -210px;
    left: 0;
    top: 0;
    border-radius: 50%;
    pointer-events: none;
    z-index: 2;
    background: radial-gradient(circle,rgba(242,193,78,.07),transparent 65%);
    opacity: 0;
    transition: opacity .4s;
}

/* RESPONSIVE LAYOUT: at smaller screen widths, navigation is hidden and grids become one column. */
@media(max-width:820px) {
    nav.top ul {
        display: none;
    }
    .hero,
    .fg,
    .grid,
    .grid.two-up,
    .steps,
    .two {
        grid-template-columns: 1fr;
    }
    .hero {
        min-height: auto;
    }
    .emb {
        order: -1;
        width: min(55vw,260px);
    }
    .brand {
        font-size: 21px;
    }
}

@media(prefers-reduced-motion:reduce) {
    .view,
    .emb img,
    .emb::before,
    .emb::after,
    .st::before {
        animation: none;
    }
    html {
        scroll-behavior: auto;
    }
}



/* PICTURES: project thumbnails, team photos, About gallery */
.th { overflow: hidden; }
.th img { width: 100%; height: 100%; object-fit: cover; display: block; }
.av { overflow: hidden; }
.av img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pics { display: grid; gap: 16px; margin-top: 32px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.pics img { width: 100%; aspect-ratio: 16/10; object-fit: cover; display: block; border-radius: 4px; border: 1px solid rgba(242,193,78,.25); }
/* FORM: error text, disabled button, hidden spam trap field */
.err { color: #ffb4a8; margin-top: 12px; font-size: 14px; line-height: 1.6; }
.hp { position: absolute; left: -9999px; width: 0; height: 0; opacity: 0; }
button.btn:disabled { opacity: .6; cursor: wait; }
</style>
</head>

<!-- INTRO JAVASCRIPT: controls the opening animation, click/keyboard behavior, and floating gold particles. -->
<script>
(() => {
    const reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;
    const intro = document.getElementById('intro');
    const L = intro.querySelector('.l');
    const R = intro.querySelector('.r');
    // right half = clone of the same stage, kept in sync through classes on #intro
    const c = document.getElementById('src').cloneNode(true);
    c.removeAttribute('id');
    c.querySelectorAll('[tabindex]').forEach(e => e.removeAttribute('tabindex'));
    c.querySelectorAll('[role]').forEach(e => e.removeAttribute('role'));
    R.appendChild(c);
    let started = false;
    let timer;
    const ROT = reduce ? 20 : 1100;
    const SPLIT = reduce ? 400 : 1250;
    // Condition below: if (started) return; makes sure the intro opening runs only once.
    function go() {
        if (started) {
            return;
        }
        started = true;
        clearTimeout(timer);
        intro.classList.add('upright', 'loading');
        setTimeout(() => {
            intro.classList.add('split');
            setTimeout(() => {
                intro.remove();
                document.body.classList.add('done');
            }, SPLIT + 80);
        }, ROT + 250);
    }
    intro.addEventListener('click', e => {
        if (e.target.closest('.click-area')) {
            go();
        }
    });
    intro.addEventListener('keydown', e => {
        if ((e.key === 'Enter' || e.key === ' ') && e.target.closest('.click-area')) {
            e.preventDefault();
            go();
        }
    });
    intro.querySelectorAll('.click-area').forEach(a => {
        a.addEventListener('mouseenter', () => intro.classList.add('hover'));
        a.addEventListener('mouseleave', () => intro.classList.remove('hover'));
    });
    const img = intro.querySelector('.logo');
    Promise.all([img.decode ? img.decode().catch(() => {
        }) : 0, document.fonts ? document.fonts.ready : 0]).then(() => {
        requestAnimationFrame(() => {
            intro.classList.add('ready');
            timer = setTimeout(go, 3000);
        });
    });
    setTimeout(() => {
        if (!intro.classList.contains('ready')) {
            intro.classList.add('ready');
            if (!started && !timer) {
                timer = setTimeout(go, 3000);
            }
        }
    }, 2500);
    const box = document.getElementById('particles');
    const N = 28;
    const cols = ['255,212,90', '232,184,74', '246,201,69', '217,164,58'];
    let W = innerWidth;
    let H = innerHeight;
    const ps = [];
    for (let i = 0; i < N; i++) {
        const el = document.createElement('div');
        el.className = 'p';
        const base = Math.max(1, W * 0.001);
        const s = base * (1 + Math.random() * 1.1);
        const col = cols[i % 4];
        el.style.cssText = `width:${s}px;height:${s}px;background:rgb(${col});box-shadow:0 0 ${s * 2}px rgba(${col},.35)`;
        box.appendChild(el);
        ps.push({ el, x: Math.random() * W, y: Math.random() * H, a: Math.random() * 6.283, sp: 4 + Math.random() * 10, turn: (Math.random() - .5) * .35,
            ph: Math.random() * 6.283, fr: .1 + Math.random() * .25, lo: .15 + Math.random() * .2, hi: .5 + Math.random() * .35 });
    }
    function paint(t) {
        for (const p of ps) {
            p.el.style.transform = `translate3d(${p.x}px,${p.y}px,0)`;
            p.el.style.opacity = (p.lo + (p.hi - p.lo) * (.5 + .5 * Math.sin(p.ph + t * p.fr))).toFixed(3);
        }
    }
    addEventListener('resize', () => {
        W = innerWidth;
        H = innerHeight;
    });
    if (reduce) {
        paint(0);
    }
    else {
        let last = performance.now();
        (function loop(now) {
            const dt = Math.min(.05, (now - last) / 1000);
            last = now;
            for (const p of ps) {
                p.a += p.turn * dt * (Math.sin(now / 4000 + p.ph));
                p.x += Math.cos(p.a) * p.sp * dt;
                p.y += Math.sin(p.a) * p.sp * dt;
                if (p.x < -5) {
                    p.x = W + 5;
                }
                else if (p.x > W + 5) {
                    p.x = -5;
                }
                if (p.y < -5) {
                    p.y = H + 5;
                }
                else if (p.y > H + 5) {
                    p.y = -5;
                }
            }
            paint(now / 1000);
            requestAnimationFrame(loop);
        })(last);
    }
})();

// Conditions: if (!s) stops with a 'not found' page for an unknown service;

// PROJECT DETAIL PAGE: builds the cards for one category of projects (for example web or UI design).
// PROJECT CARDS: the cards for one category. Used by the Projects pages AND by the home page.
function projCards(k) {
    return `<div class="grid">${PROJ[k].map((p, i) => {
        p = p.split('|');
        const u = (LINK[k] || [])[i];
        return `<${u ? 'a href="' + u + '" target="_blank" rel="noopener"' : 'div'} class="card tilt"><div class="th" style="--h:${38 + i * 10}">${thumb((PROJ_IMG[k] || [])[i], p[0], p[0])}</div><h3 style="font-size:26px">${p[0]}</h3><span class="go" style="margin:0">${p[1]} · ${p[3]}</span><p>${p[2]}</p><span class="go">${u ? CTA[k] : 'Link coming soon'}</span></${u ? 'a' : 'div'}>`;
    }).join('')}</div>`;
}
function proj(k) {
    const s = sv(k);
    if (!s) {
        return nf();

    return `<section class="wrap"><p class="crumb"><a href="#/projects">Projects</a> / ${s.t}</p><h2 class="h2">${s.t}</h2>${demo('Demo projects: replace with your uploads', 'margin-top:14px')}${projCards(k)}<div class="row" style="margin-top:36px"><a class="btn" href="#/start?service=${k}">Start a similar project</a></div></section>`;
}
// SERVICE DETAIL PAGE: displays a service description, included deliverables, selectable options, and a request link.
function svc(k) {

    return `<section class="wrap"><p class="crumb"><a href="#/services">Services</a> / ${s.t}</p><h2 class="h2">${s.t}</h2><p style="margin-top:14px">${st(s)}</p><p class="sub">${s.d}</p><h3 style="font:500 28px 'Cormorant Garamond',serif;color:var(--gold2);margin:36px 0 14px">What you get</h3><div class="chips">${s.inc.map(i => `<span>${i}</span>`).join('')}</div><h3 style="font:500 28px 'Cormorant Garamond',serif;color:var(--gold2);margin:36px 0 14px">Choose what you need</h3><div class="grid">${s.o.map(o => `<a class="card tilt" href="#/start?service=${k}&type=${encodeURIComponent(o)}"><h3 style="font-size:26px">${o}</h3><span class="go">Request this →</span></a>`).join('')}</div><p style="margin-top:32px"><a class="btn g" href="#/projects/${k}">See completed projects</a></p></section>`;
}
// Condition: p.get('service') || 'web' falls back to 'web' when the address has no service.
// PROJECT ENQUIRY FORM: builds the form and preselects a service/type from the URL query string when supplied.
function start(q) {
    const p = new URLSearchParams(q || '');
    const k = p.get('service') || 'web';
    const ty = p.get('type') || '';
    return `<section class="wrap"><h2 class="h2">Start your project.</h2><p class="sub">Tell us what you need and we will get back to you with next steps.</p><form id="pf"><div class="two"><label>Your name<input name="n" required autocomplete="name"></label><label>Email<input name="e" type="email" required autocomplete="email"></label></div><div class="two"><label>Phone or WhatsApp<input name="p" type="tel" required autocomplete="tel"></label><label>Company (optional)<input name="c"></label></div><div class="two"><label>Service<select name="s" id="ss">${SERVICES.map(s => `<option value="${s.id}" ${s.id === k ? 'selected' : ''}>${s.t}</option>`).join('')}</select></label><label>What do you need?<select name="t" id="st"></select></label></div><div class="two"><label>Budget<input name="b" required autocomplete="off" placeholder="For example: ₹30,000"></label><label>Timeline<select name="l"><option>Flexible</option><option>Within 2 weeks</option><option>Within a month</option><option>1 to 3 months</option></select></label></div><label>Project details<textarea name="m" rows="5" required placeholder="Tell us about your business and what you want us to make."></textarea></label><input class="hp" type="text" name="_honey" tabindex="-1" autocomplete="off" aria-hidden="true"><button class="btn" type="submit">Send request</button></form></section>`;
}
const nf = () => `<section class="wrap"><h2 class="h2">Page not found.</h2><p class="sub"><a href="#/" style="color:var(--gold)">Back to home</a></p></section>`;
// FORM OPTIONS: fills the 'What do you need?' dropdown based on the selected service.
function fillTypes(ty) {
    const s = sv($('#ss').value);
    $('#st').innerHTML = s.o.map(o => `<option ${o === ty ? 'selected' : ''}>${o}</option>`).join('');
}
// FORM BEHAVIOR: shows the thank-you AT ONCE (the visitor never waits), then sends the request in the background in TWO ways at the same time:
// 1) Telegram (instant phone alert, when set up in C.tg)  2) email through the free FormSubmit service.
// It counts as sent when EITHER one works. If both fail, or 15 seconds pass, the visitor gets WhatsApp and email buttons instead.
function bindStart(q) {
    const ty = new URLSearchParams(q || '').get('type') || '';
    fillTypes(ty);
    $('#ss').onchange = () => fillTypes('');
    $('#pf').onsubmit = e => {
        e.preventDefault();
        const f = Object.fromEntries(new FormData(e.target));
        const s = sv(f.s);
        const safeName = f.n.replace(/[<>&]/g, '');
        const msg = `New project request\nName: ${f.n}\nEmail: ${f.e}\nPhone: ${f.p}\nCompany: ${f.c || '-'}\nService: ${s.t} (${f.t})\nBudget: ${f.b}\nTimeline: ${f.l}\n\n${f.m}`;
        const waDetails = 'https://wa.me/' + C.wa + '?text=' + encodeURIComponent(msg);
        const mailDraft = 'mailto:' + C.mail + '?subject=' + encodeURIComponent('Project request: ' + s.t) + '&body=' + encodeURIComponent(msg);
        // Changes the status line, but only if the visitor is still on this page.
        const say = html => {
            const n = $('#sn');
            if (n) {
                n.innerHTML = html;
            }
        };
        // Step 1: thank-you appears immediately. The WhatsApp button already holds all the details.
        $('#pf').outerHTML = `<div class="ok"><h3 style="font-size:30px;color:var(--gold2)">Thank you, ${safeName}.</h3><p id="sn">Sending your request...</p><div class="row" style="margin-top:16px"><a class="btn" target="_blank" rel="noopener" href="${waDetails}">Send the details on WhatsApp too</a></div></div>`;
        scrollTo(0, 0);
        // Step 2: send to your email in the background. After 15 seconds we stop waiting.
        const stop = new AbortController();
        const timer = setTimeout(() => stop.abort(), 15000);
        const byEmail = fetch('https://formsubmit.co/ajax/' + C.mail, {
            method: 'POST',
            // Plain form data (not JSON) avoids an extra browser check round trip, so it is quicker.
            headers: { 'Accept': 'application/json' },
            body: new URLSearchParams({
                name: f.n, email: f.e, phone: f.p, company: f.c || '-',
                service: s.t, need: f.t, budget: f.b, timeline: f.l, message: f.m,
                _subject: 'New project request: ' + s.t,
                _replyto: f.e,
                _template: 'table',
                _honey: f._honey || ''
            }),
            signal: stop.signal,
            keepalive: true
        }).then(res => res.json().then(data => {
            // Condition: anything other than a clear success is treated as a failure.
            if (!res.ok || String(data.success) !== 'true') {
                throw new Error('Email failed');
            }
        }));
        // Condition: Telegram is used only when both the token and the chat id were filled in above.
        const byTelegram = (C.tg && C.tg.token && C.tg.chat)
            ? fetch('https://api.telegram.org/bot' + C.tg.token + '/sendMessage', {
                method: 'POST',
                body: new URLSearchParams({ chat_id: C.tg.chat, text: msg.slice(0, 3900) }),
                signal: stop.signal,
                keepalive: true
            }).then(res => res.json()).then(data => {
                if (!data.ok) {
                    throw new Error('Telegram failed');
                }
            })
            : Promise.reject(new Error('Telegram is not set up'));
        // Promise.any waits for the FIRST one that works, so a fast Telegram alert is not held back by slow email.
        Promise.any([byEmail, byTelegram])
            .then(() => {
                say('Your request has reached our team. We will reply on your email or phone soon. For the fastest reply, tap the WhatsApp button below.');
            })
            .catch(() => {
                say('We could not send your request automatically. Please send it with one of these buttons so we receive it:');
                const row = $('.ok .row');
                if (row) {
                    row.insertAdjacentHTML('beforeend', `<a class="btn g" href="${mailDraft}">Send by email</a>`);
                }
            })
            .finally(() => clearTimeout(timer));
    };
}
// Condition chain: if / else if picks which page to show from the address (#/about, #/start ...).
// ROUTER: reads the URL hash (#/about, #/services, #/start, etc.) and renders the matching page without a full reload.
function route() {
    const h = location.hash.slice(1) || '/';
    const [path, q] = h.split('?');
    const p = path.split('/').filter(Boolean);
    let html;
    if (!p.length) {
        html = V['/']();
    }
    else if (p[0] === 'projects' && p[1]) {
        html = proj(p[1]);
    }
    else if (p[0] === 'service') {
        html = svc(p[1]);
    }
    else if (p[0] === 'start') {
        html = start(q);
    }
    else {
        html = (V['/' + p[0]] || nf)();
    }
    $('#app').innerHTML = `<div class="view">${html}</div>`;
    scrollTo(0, 0);
    const top = p[0] === 'service' ? 'services' : p[0] === 'start' ? '' : p[0] || '';
    document.querySelectorAll('#nv a').forEach(a => {
        const on = a.getAttribute('href') === '#/' + top;
        on ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current');
    });
    // Condition: the project form is on the Start page AND at the bottom of the home page (no path).
    if (p[0] === 'start' || !p.length) {
        bindStart(q);
    }
    document.querySelectorAll('.num').forEach(n => {
        const to = +n.dataset.to;
        let v = 0;
        const step = () => {
            v += Math.max(1, to / 40);
            n.textContent = Math.min(to, Math.round(v)) + '+';
            if (v < to) {
                requestAnimationFrame(step);
            }
        };
        // Condition: people who prefer less motion see the final number at once; others see it count up.
        reduce ? n.textContent = to + '+' : step();
    });
}

// CONTACT LINKS: fills footer/header links from the configuration above.
// tilt + cursor glow (mouse only, skipped for reduced motion)
// Condition: tilt and glow run only with a mouse and when reduced motion is not requested.
if (!reduce && matchMedia('(pointer:fine)').matches) {
    const g = $('#glow');
    document.addEventListener('mousemove', e => {
        g.style.opacity = 1;
        g.style.transform = `translate(${e.clientX}px,${e.clientY}px)`;
        const c = e.target.closest && e.target.closest('.tilt');
        if (c) {
            const r = c.getBoundingClientRect();
            const x = (e.clientX - r.left) / r.width - .5;
            const y = (e.clientY - r.top) / r.height - .5;
            c.style.transform = `perspective(700px) rotateY(${x * 8}deg) rotateX(${-y * 8}deg)`;
        }
    });
    document.addEventListener('mouseout', e => {
        const c = e.target.closest && e.target.closest('.tilt');
        if (c) {
            c.style.transform = '';
        }
    });
}
